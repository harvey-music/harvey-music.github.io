<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur 工作室 - 公告栏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ---------- 色板：与 logo 同源的黑金。以后改配色只改这一段 ---------- */
    :root {
      /* 底色：中性黑，去掉原来的蓝调 */
      --bg: #0b0b0d;
      --bg-soft: #111216;
      --bg-deep: #08080a;
      --card: #17181c;
      --card-sel: #221d12;
      --line: #26272c;
      --line-soft: #232429;
      --line-strong: #3a3b42;
      /* 文字 */
      --text: #eaeaec;
      --text-dim: #c4c6cb;
      --text-mute: #9a9da4;
      --text-faint: #6c6f76;
      --text-ghost: #565a61;
      /* 品牌金：取自 logo 渐变，只用于状态与身份标识 */
      --gold: #c9a227;
      --gold-line: rgba(201, 162, 39, 0.45);
      --gold-edge: #6b5620;
      --gold-wash: rgba(201, 162, 39, 0.08);
      --gold-wash-soft: rgba(201, 162, 39, 0.06);
      --gold-shadow: rgba(201, 162, 39, 0.26);
      /* 交互层：浅金，比标志金亮一档，小字号和按钮都清楚 */
      --accent: #e3c274;
      --accent-hover: #f0d79a;
      --accent-line: rgba(227, 194, 116, 0.45);
      --accent-line-strong: rgba(227, 194, 116, 0.6);
      --accent-dot: rgba(227, 194, 116, 0.55);
      --accent-glow: rgba(227, 194, 116, 0.16);
      --accent-grad: linear-gradient(180deg, #f2d99b, #d9b25c);
      --accent-grad-hover: linear-gradient(180deg, #f9e5b8, #e6c877);
      --on-accent: #17181a;
      /* 状态色：警示保留独立暖黄，不参与品牌金 */
      --warn: #f0b429;
      --warn-hover: #ffc95c;
      --warn-wash: rgba(240, 180, 41, 0.08);
      --warn-line: rgba(240, 180, 41, 0.38);
      --danger: #ff9c8a;
      --nav-h: 54px;
    }

    /* 正文链接兜底：没单独设色的链接不要退回浏览器默认蓝 */
    a { color: var(--accent); }

    /* ---------- 跨页面切换：0.24s 交叉淡入，无位移 ----------
       只淡不滑；顶部导航命名后原地保留，不跟着内容一起淡。 */
    @view-transition {
      navigation: auto;
    }

    .globalnav { view-transition-name: site-nav; }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.24s;
      animation-timing-function: cubic-bezier(0.33, 0, 0.2, 1);
    }

    ::view-transition-old(site-nav),
    ::view-transition-new(site-nav) {
      animation: none;
    }

    @supports not (view-transition-name: none) {
      body { animation: page-fade-in 0.26s ease-out both; }
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 页内锚点（如提示条里的 #notice-prism）平滑滚动 */
    html {
      scroll-behavior: smooth;
    }

    /* 跨页返回时用瞬时定位还原滚动位置，避免平滑滚动把整页"扫"一遍 */
    html.is-restoring {
      scroll-behavior: auto;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }

    /* ---------- 常驻顶部导航：与首页、Silverdaw 页同一套 ---------- */
    .globalnav {
      position: sticky;
      top: 0;
      z-index: 60;
      height: var(--nav-h);
      background: rgba(11, 11, 13, 0.72);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.25s, background 0.25s;
    }

    /* 一滚动就补一条细线，让导航和内容分层 */
    .globalnav.is-stuck {
      background: rgba(11, 11, 13, 0.86);
      border-bottom-color: var(--line);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 30px;
      width: min(1160px, 92%);
      height: 100%;
      margin-inline: auto;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .nav-brand img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }

    .nav-link {
      padding: 7px 14px;
      border-radius: 999px;
      color: var(--text-mute);
      font-size: 0.9rem;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s, background 0.2s, transform 0.16s;
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    /* 当前所在栏目 */
    .nav-link.is-active {
      color: var(--accent);
      background: var(--gold-wash);
    }

    .nav-gh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-left: 6px;
      border-radius: 50%;
      color: var(--text-faint);
      text-decoration: none;
      transition: color 0.2s, background 0.2s, transform 0.16s;
    }

    .nav-gh:hover {
      color: var(--accent);
      background: var(--gold-wash);
    }

    @media (max-width: 640px) {
      :root { --nav-h: 50px; }
      .nav-inner { gap: 10px; }
      .nav-brand { font-size: 0.86rem; gap: 7px; }
      .nav-brand img { width: 22px; height: 22px; }
      .nav-link { padding: 6px 8px; font-size: 0.82rem; }
      .nav-gh { width: 28px; height: 28px; margin-left: 2px; }
    }

    /* 页内锚点（如 #notice-prism）落地时，给吸顶导航让出高度 */
    [id] { scroll-margin-top: calc(var(--nav-h) + 16px); }

    /* ---------- 返回入口：与 Silverdaw 产品页同款胶囊 ---------- */
    .page-back {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 22px;
      padding: 5px 14px 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-mute);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.16s;
    }

    .page-back:hover {
      color: var(--accent);
      border-color: var(--accent-line);
      background: var(--gold-wash);
    }

    /* 尖角用文字画，与产品页保持一致 */
    .page-back .chev-l {
      font-size: 1.1em;
      line-height: 1;
      transform: translateY(-0.5px);
    }

    /* ---------- 点击反馈：与产品页同一套，按下缩 4%，松手回弹 ---------- */
    .nav-link:active { transform: scale(0.96); }
    .nav-gh:active { transform: scale(0.92); }
    .page-back:active { transform: scale(0.96); }

    .page {
      width: min(860px, 92%);
      margin: 56px auto 72px;
    }

    /* ---------- 欢迎区 ---------- */
    .hero {
      text-align: center;
      margin-bottom: 56px;
    }

    .hero h1 {
      font-size: clamp(1.75rem, 4.5vw, 2.5rem);
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .hero p {
      color: var(--text-mute);
      font-size: 0.98rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ---------- 顶部提示条（品牌金 Alert） ---------- */
    .alert {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 40px;
      padding: 16px 20px;
      background: var(--gold-wash);
      border: 1px solid var(--accent-line);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
    }

    /* 公告数据还没到位时是空容器，别让它先占一块空框闪一下 */
    .alert:empty { display: none; }

    .alert-icon {
      flex: none;
      width: 20px;
      height: 20px;
      margin-top: 3px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 17px;
      text-align: center;
    }

    .alert-title {
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 2px;
    }

    .alert-body p {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    /* ---------- 分组标题 ---------- */
    .group-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }

    .group-head h2 {
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    .group-head .count {
      font-size: 0.82rem;
      color: var(--text-faint);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 10px;
      line-height: 1.7;
    }

    .group-hint {
      color: var(--text-faint);
      font-size: 0.88rem;
      margin-bottom: 24px;
    }

    /* ---------- 公告条目 ---------- */
    .notice-list {
      display: grid;
      gap: 16px;
    }

    .notice {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 24px;
    }

    /* 置顶那条：金色描边，一眼能看见 */
    .notice--pin {
      border-color: var(--accent-line);
    }

    .notice-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .notice-date {
      color: var(--text-faint);
      font-size: 0.84rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--text-mute);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 10px;
      line-height: 1.7;
    }

    .tag--accent {
      color: var(--accent);
      border-color: var(--accent-line);
    }

    .notice h3 {
      font-size: 1.06rem;
      margin-bottom: 8px;
    }

    .notice p {
      color: var(--text-dim);
      font-size: 0.93rem;
    }

    .notice p + p {
      margin-top: 8px;
    }

    .notice a {
      color: var(--accent);
      text-decoration: none;
    }

    .notice a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .page { margin: 36px auto 56px; }
      .hero { margin-bottom: 40px; }
      .notice { padding: 18px 18px; }
    }

    /* 系统开了「减少动态效果」：淡入与按下缩放全部关掉 */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body { animation: none; }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
      }

      .nav-link:active,
      .nav-gh:active,
      .page-back:active { transform: none; }
    }
  </style>
</head>
<body>

  <!-- ============ 常驻顶部导航：与首页同一套，「公告」为当前栏目 ============ -->
  <nav class="globalnav" id="globalnav" aria-label="主导航">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <img src="logo-mark.png" alt="" width="26" height="26">
        Arthur 工作室
      </a>

      <div class="nav-links">
        <a class="nav-link" href="index.html#hanhua">汉化</a>
        <a class="nav-link" href="softlib.html">软件库</a>
        <a class="nav-link is-active" href="notice.html" aria-current="page">公告</a>
        <a class="nav-link" href="index.html#liuyan">留言板</a>
        <a class="nav-link" href="account.html">我的</a>
        <a class="nav-link" href="index.html#about">关于</a>
        <a class="nav-gh" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub 首页">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>
    </div>
  </nav>

  <div class="page">

    <!-- 返回入口：公告页是独立页面，没有栏目内导航，单独给一个返回首页的落点 -->
    <a class="page-back" href="index.html"><span class="chev-l" aria-hidden="true">‹</span> 返回首页</a>

    <!-- 欢迎区 -->
    <header class="hero">
      <h1>公告栏</h1>
      <p>站点更新、版本发布与维护通知都发在这里，最新的排在最上面。</p>
    </header>

    <!-- 金色提示条：内容来自 data/notices.json 的 alert 字段，改文案不必动这里 -->
    <div class="alert" role="status" data-notice-alert></div>

    <section class="group">
      <div class="group-head">
        <h2>全部公告</h2>
        <span class="count"><span data-notice-count>10</span> 条</span>
      </div>
      <p class="group-hint">置顶条目在上，其余按时间倒序排列。</p>

      <div class="notice-list" data-notice-page></div>

      <noscript>
        <p class="group-hint">公告内容需要启用 JavaScript 才能显示。</p>
      </noscript>
    </section>

  </div>

  <script>
    /* 导航滚动态：一滚动就补一条细线 */
    (function () {
      var nav = document.getElementById('globalnav');
      if (!nav) return;
      function onScroll() {
        nav.classList.toggle('is-stuck', window.scrollY > 4);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>

  <!-- ============ 跨页返回 + 锚点落点 ============
       1. 离开页面时把当前滚动位置按路径记进 sessionStorage（按标签页隔离）；
       2. 从站内别的页面点进来时瞬时还原，新开标签或首次进入仍停在顶部；
       3. 带 # 锚点进来时瞬时对准锚点 —— 浏览器默认会从页顶平滑滑过去，淡入那一下看着像跳错位置；
       4. 浏览器自带的前进/后退会自己还原，这里不插手。
       与 index / silverdaw 两页保持一致。 -->
  <script>
    (function () {
      var KEY = 'arthur-scroll';
      // 根目录可能写成 "/" 也可能写成 "/index.html"，视作同一页，位置才对得上
      var here = location.pathname.replace(/index\.html$/, '') + location.search;
      var root = document.documentElement;

      // 用户一开始操作就停手，绝不抢滚动
      var touched = false;
      ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(function (type) {
        window.addEventListener(type, function () { touched = true; }, { passive: true, once: true });
      });

      // 在「瞬时滚动」窗口里定位：is-restoring 把 scroll-behavior 换回 auto，
      // 两帧后放开，之后用户点页内锚点依旧是平滑滚动
      function snap(fn) {
        root.classList.add('is-restoring');
        fn();
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { root.classList.remove('is-restoring'); });
        });
      }

      // ---------- A) 带 # 锚点进来：解析期先把位置对上 ----------
      // 首次锚点定位浏览器走的是 scroll-behavior: smooth —— 淡入那一下还停在页顶，
      // 接着自己往下滑一段，看起来就像「跳错位置」。这里自己瞬时对准一次。
      // 用 scrollIntoView 才能自动吃上元素自己的 scroll-margin-top（给吸顶导航让位）。
      var hasHash = location.hash.length > 1;

      // 公告条目由 notices.js 异步渲染，#notice-xxx 在解析阶段可能还不存在，
      // 所以把「查找 + 对准」拆成函数，等渲染完成（notices:rendered）后再找一次。
      function findAnchor() {
        if (!hasHash) return null;
        var hashId = location.hash.slice(1);
        try { hashId = decodeURIComponent(hashId); } catch (err) {}
        return document.getElementById(hashId);
      }

      var anchor = findAnchor();

      // 图片、字体、公告没到位时页面高度还会变，所以每次都重新「对准」，不记绝对坐标
      function alignToAnchor() {
        if (touched) return;
        if (!anchor) anchor = findAnchor();
        if (!anchor) return;
        snap(function () {
          anchor.scrollIntoView({ block: 'start', inline: 'nearest' });
        });
      }

      if (anchor) {
        alignToAnchor();
        document.addEventListener('DOMContentLoaded', alignToAnchor);
        window.addEventListener('load', function () { requestAnimationFrame(alignToAnchor); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignToAnchor);
      }
      document.addEventListener('notices:rendered', alignToAnchor);

      function read() {
        try {
          var raw = sessionStorage.getItem(KEY);
          return raw ? JSON.parse(raw) : { pos: {}, last: '' };
        } catch (err) {
          return null; // 隐私模式或文件协议禁用了存储，直接放弃，不影响页面
        }
      }

      function write(data) {
        try {
          sessionStorage.setItem(KEY, JSON.stringify(data));
        } catch (err) {}
      }

      // 1) 记下离开时的位置（pagehide 与切到后台各记一次，移动端更稳）
      function save() {
        var data = read();
        if (!data) return;
        data.pos[here] = Math.round(window.pageYOffset || document.documentElement.scrollTop || 0);
        data.last = here;
        write(data);
      }

      window.addEventListener('pagehide', save);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') save();
      });

      // 2) 只有「从站内别的页面点进来」才还原（带 # 的上面已按锚点对准）
      var data = read();
      if (hasHash || !data || !data.last || data.last === here) return;

      var navType = '';
      try {
        var entry = performance.getEntriesByType('navigation')[0];
        navType = entry ? entry.type : '';
      } catch (err) {}
      if (navType === 'back_forward' || navType === 'prerender') return;

      var target = data.pos[here];
      if (typeof target !== 'number' || target < 1) return;

      function apply() {
        snap(function () { window.scrollTo(0, target); });
      }

      // 图片没加载完时页面还短，滚动会被截断，加载完再补一次
      function fixLater() {
        if (touched) return;
        if (Math.abs((window.pageYOffset || 0) - target) > 4) apply();
      }

      apply();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          if (!touched) apply();
        });
      }
      window.addEventListener('load', function () {
        requestAnimationFrame(fixLater);
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fixLater);

      // 公告渲染完成后页面会变长，之前被截断的还原位置再补一次
      document.addEventListener('notices:rendered', function () {
        requestAnimationFrame(fixLater);
      });
    })();
  </script>
  <script src="notices.js" defer></script>
</body>
</html>
