<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur 工作室</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    .logo {
      width: auto;
      max-width:140px;
      height: auto;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .subtitle {
      color: #9aa0a6;
      font-size: 1rem;
      margin-bottom: 42px;
      max-width: 480px;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: #4f8cff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #6ea0ff;
    }

    .btn-secondary {
      background: transparent;
      color: #e8eaed;
      border-color: #2a2f3a;
    }

    .btn-secondary:hover {
      border-color: #4f8cff;
    }

    .footer-links {
      display: flex;
      gap: 22px;
      color: #6b7280;
      font-size: 0.88rem;
    }

    .footer-links a {
      color: #9aa0a6;
      text-decoration: none;
      transition: 0.2s;
    }

    .footer-links a:hover {
      color: #4f8cff;
    }

    /* ---------- 公告栏入口（两个按钮下方居中） ---------- */
    .notice-entry {
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(360px, 100%);
      margin: 0 auto 46px;
      padding: 14px 18px;
      background: #1d212b;
      border: 1px solid #2a2f3a;
      border-radius: 14px;
      text-align: left;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    .notice-entry:hover {
      border-color: #4f8cff;
      transform: translateY(-2px);
    }

    .notice-dot {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4f8cff;
      box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.16);
    }

    .notice-text {
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .notice-text strong {
      font-size: 0.98rem;
      font-weight: 600;
    }

    .notice-text em {
      font-style: normal;
      font-size: 0.82rem;
      color: #6b7280;
    }

    .notice-arrow {
      margin-left: auto;
      color: #6b7280;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    .notice-entry:hover .notice-arrow {
      color: #4f8cff;
      transform: translateX(3px);
    }
  </style>
</head>
<body>

 <img class="logo" src="logo.png" alt="Arthur 工作室 logo">

  <h1>Arthur 工作室</h1>
  <p class="subtitle">专注于开源汉化与独立软件开发的小工作室</p >

  <div class="buttons">
    <a class="btn btn-primary" href="start.html">进入首页</a >
    <a class="btn btn-secondary" href="home.html">关于</a >
  </div>

  <!-- 公告栏入口：两个按钮下方居中，点开进入公告栏页 -->
  <a class="notice-entry" href="notice.html">
    <span class="notice-dot" aria-hidden="true"></span>
    <span class="notice-text">
      <strong>公告栏</strong>
      <em>站点更新与版本发布通知</em>
    </span>
    <span class="notice-arrow" aria-hidden="true">→</span>
  </a>

  <div class="footer-links">
    <a href="https://github.com/harvey-music" target="_blank">GitHub</a >
    <span>邮箱：zjh041106@qq.com</span>
  </div>

</body>
</html>
