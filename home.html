<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur 工作室 - 项目与关于</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1115;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    a { color: #4f8cff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      width: min(1080px, 92%);
      margin: 0 auto;
    }

    /* 顶部一行：左返回，右名字 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 4%;
    }

    .back-link {
      color: #6b7280;
      font-size: 1.1rem;
      text-decoration: none;
      transition: 0.2s;
    }
    .back-link:hover { color: #4f8cff; text-decoration: none; }

    .brand {
      font-weight: 700;
      color: #e8eaed;
      font-size: 1.05rem;
    }
    .brand:hover { color: #4f8cff; text-decoration: none; }

    /* 通用区块 */
    .section {
      padding: 80px 0;
      border-top: 1px solid #2a2f3a;
    }

    .section h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    /* 关于区 */
    .about-text {
      max-width: 720px;
      color: #c3c8d0;
    }

    /* 联系区 */
    .contact-list {
      list-style: none;
      display: grid;
      gap: 12px;
      max-width: 480px;
    }

    .contact-list li {
      background: #1d212b;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.95rem;
    }

    footer {
      border-top: 1px solid #2a2f3a;
      padding: 32px 0 48px;
      text-align: center;
      color: #6b7280;
      font-size: 0.88rem;
    }

    @media (max-width: 640px) {
      .section { padding: 56px 0; }
    }
  </style>
</head>
<body>

  <!-- 顶部一行：左返回，右名字 -->
  <div class="topbar">
    <a class="back-link" href="index.html">返回欢迎页</a >
    <a class="brand" href="index.html">Arthur 工作室</a >
  </div>

  <main>

    <!-- 关于区（放最上面） -->
    <section id="about" class="section" style="border-top: none;">
      <div class="container">
        <h2>关于</h2>
        <p class="about-text">
          我是 Harvey，Arthur 工作室的创建者。目前专注于开源软件汉化，同时也在开发自己的独立软件。
          所有项目均开源免费发布。
        </p >
      </div>
    </section>

    <!-- 联系区 -->
    <section id="contact" class="section">
      <div class="container">
        <h2>联系</h2>
        <ul class="contact-list">
          <li>GitHub：<a href="https://github.com/harvey-music" target="_blank">github.com/harvey-music</a ></li>
          <li>邮箱：zjh041106@qq.com</li>
        </ul>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <p>© <span id="year"></span> Arthur 工作室 · 所有项目均开源免费发布</p >
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
